plugins { id 'com.android.application' }
android {
    namespace 'com.smartfamilyframe.tv'
    compileSdk 36
    defaultConfig {
        applicationId 'com.smartfamilyframe.tv'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    // Stable signing (issue #10). Credentials come from android/keystore.properties (gitignored)
    // or SFF_KEYSTORE_* environment variables (CI secrets). Without them, the default debug key is used.
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
    def signingValue = { String prop, String env -> System.getenv(env) ?: keystoreProps.getProperty(prop) }
    def storePath = signingValue('storeFile', 'SFF_KEYSTORE_FILE')
    if (storePath) {
        signingConfigs {
            stable {
                storeFile new File(storePath).isAbsolute() ? new File(storePath) : rootProject.file(storePath)
                storePassword signingValue('storePassword', 'SFF_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'SFF_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'SFF_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { minifyEnabled false; if (storePath) signingConfig signingConfigs.stable }
        debug { if (storePath) signingConfig signingConfigs.stable }
    }
    lint { abortOnError true }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'junit:junit:4.13.2'
}
tasks.register('prepareFrameWeb', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/build-tv-web.mjs'
    // Always build so local Firebase configuration changes cannot leave stale APK assets.
}
tasks.named('preBuild').configure { dependsOn 'prepareFrameWeb' }
